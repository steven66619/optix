[package]
name = "optix"
version = "0.1.0"
edition = "2021"
description = "A GPU-accelerated terminal emulator: kitty-grade power, modern looks."
license = "MIT"

[lib]
name = "optix"
path = "src/lib.rs"

[[bin]]
name = "optix"
path = "src/main.rs"

[[bin]]
name = "optix-msg"
path = "src/bin/optix-msg.rs"

[dependencies]
alacritty_terminal = "0.26"
# `wayland-data-control` matches alacritty: without it arboard cannot serve
# or read the clipboard on Wayland sessions. On X11-only setups arboard
# simply falls back to the X11 backend, so this is safe to keep on.
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
libc = "0.2"
miniz_oxide = "0.8"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
wgpu = "30"
winit = { version = "0.30", features = ["rwh_06"] }

[profile.release]
lto = true
